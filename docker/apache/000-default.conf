# VirtualHost par défaut — sert le frontend React compilé + le backend PHP
# sous /pfe_soutenance_manager/backend, et mappe /api vers les endpoints PHP.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # SPA (React Router) : toute URL qui ne correspond ni à /api ni au
        # backend ni à un fichier réel est renvoyée vers index.html.
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api
        RewriteCond %{REQUEST_URI} !^/pfe_soutenance_manager
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Les appels API du frontend (/api/auth/login.php, /api/soutenances/toutes.php, ...)
    # pointent vers le répertoire PHP du backend.
    Alias /api /var/www/html/pfe_soutenance_manager/backend/api
    <Directory /var/www/html/pfe_soutenance_manager/backend/api>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Photos de profil téléversées (servies en lecture seule)
    <Directory /var/www/html/pfe_soutenance_manager/backend/uploads>
        Options -Indexes
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
